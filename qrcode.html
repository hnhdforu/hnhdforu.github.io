<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10101b">
<meta name="description" content="Scan the HNHDFORU website QR code to visit the movie collection.">
<title>HNHDFORU Website QR Code</title>
<style>
:root{color-scheme:dark;--bg:#0b0b13;--panel:#151522;--gold:#e5bc66;--gold2:#ffe5a0;--text:#f8f6f0;--muted:#a9a9b5;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#211b3c,transparent 45%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:clamp(22px,6vw,42px);border:1px solid var(--line);border-radius:14px;background:#151522eF;text-align:center;box-shadow:0 24px 70px #0007}.brand{color:var(--gold2);font-weight:950;letter-spacing:2px}.kicker{margin:25px 0 4px;color:var(--gold2);font-size:.72rem;font-weight:850;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.1;margin:8px 0 10px}p{color:var(--muted)}.qr-wrap{display:inline-grid;place-items:center;margin:20px auto 10px;padding:12px;background:#fff;border-radius:10px;min-width:264px;min-height:264px}.qr-wrap img{display:block;width:240px;height:240px}.url{display:block;overflow-wrap:anywhere;color:var(--gold2);font-size:.88rem;margin:10px 0 20px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.button{display:inline-block;padding:11px 16px;border:1px solid transparent;border-radius:5px;background:var(--gold);color:#111;font-weight:850;text-decoration:none;cursor:pointer}.button.secondary{background:#ffffff0b;border-color:var(--line);color:var(--text)}.note{font-size:.76rem;margin-top:22px}a:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
<div class="brand">HN · HNHDFORU</div>
<div class="kicker">Scan to visit</div>
<h1>Take the movie collection with you.</h1>
<p>Scan this QR code with your phone camera to open the HNHDFORU website.</p>
<div class="qr-wrap"><img id="qrImage" alt="QR code linking to the HNHDFORU website" width="240" height="240"></div>
<a class="url" id="siteUrl"></a>
<div class="actions"><a class="button" id="downloadQr" download="hnhdforu-website-qr.png">Download QR code</a><a class="button secondary" href="/">Open website</a></div>
<p class="note">The QR image is generated by QRServer and encodes only the public website address.</p>
</main>
<script>
const siteUrl='https://hnhdforu.github.io/';
const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=480x480&format=png&margin=12&data='+encodeURIComponent(siteUrl);
const image=document.getElementById('qrImage');
image.src=qrUrl;
document.getElementById('siteUrl').href=siteUrl;
document.getElementById('siteUrl').textContent=siteUrl;
document.getElementById('downloadQr').href=qrUrl+'&download=1';
image.addEventListener('error',()=>{image.alt='QR code image could not load. Use the website link below.';image.hidden=true});
</script>
</body>
</html>
